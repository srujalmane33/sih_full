<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="manganeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#cf852f" />
      <stop offset="100%" stop-color="#924d20" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" stroke="url(#steelGrad)" stroke-width="2.5" fill="#0f172a" stroke-linejoin="round" />
  <!-- Satellite Orbit Arc -->
  <path d="M 10 24 C 10 14, 38 10, 38 24 C 38 38, 10 34, 10 24" stroke="url(#manganeseGrad)" stroke-width="1.8" stroke-dasharray="3 2" fill="none" opacity="0.85" />
  <!-- Inner Crystal facets -->
  <polygon points="24,12 34,18 34,30 24,36 14,30 14,18" fill="url(#manganeseGrad)" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5" />
  <polyline points="24,12 24,36" stroke="#fef08a" stroke-width="1.2" />
  <polyline points="14,18 34,30" stroke="#fef08a" stroke-width="0.8" opacity="0.6" />
  <polyline points="34,18 14,30" stroke="#fef08a" stroke-width="0.8" opacity="0.6" />
  <!-- Center Core Node -->
  <circle cx="24" cy="24" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" />
  <!-- Radar Satellite Beacon -->
  <circle cx="36" cy="13" r="2" fill="#ef4444" />
</svg>
